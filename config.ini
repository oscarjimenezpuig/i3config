; ==================================================
; POLYBAR - NORDIC / DEBIAN
; Debian + i3wm
; ==================================================

[colors]
background = #2E3440
background-alt = #3B4252
foreground = #D8DEE9
foreground-alt = #A7B1C2

blue = #81A1C1
cyan = #88C0D0
green = #A3BE8C
red = #BF616A
orange = #D08770
disabled = #616E82

; ==================================================
; BARRA PRINCIPAL
; ==================================================

[bar/main]

width = 100%
height = 28

offset-x = 15
offset-y = 0

; monitor = HDMI-1

background = ${colors.background}
foreground = ${colors.foreground}

radius = 12

border-size = 5

padding-left = 3
padding-right = 3

module-margin-left = 2
module-margin-right = 2

font-0 = DejaVu Sans Mono:size=10;2
font-1 = FontAwesome:size=11;2
font-2 = DejaVu Sans Mono:size=12;2

fixed-center = true

modules-left = i3
modules-center = calendar clock
modules-right = wlan filesystem pulseaudio

wm-restack = i3

enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize

; ==================================================
; ESCRITORIOS I3
; ==================================================

[module/i3]

type = internal/i3

pin-workspaces = true
index-sort = true
wrapping-scroll = false

enable-click = true
enable-scroll = true

format = <label-state>

label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.cyan}
label-focused-underline = ${colors.red}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.blue}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

; ==================================================
; WIFI
; ==================================================

[module/wlan]

type = internal/network

; interface = wlp2s0
interface-type = wireless
interval = 3

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = %{T2}%{F#88C0D0}%{F-}%{T-} %essid% %{F#A3BE8C}%signal%%%{F-}

label-disconnected = %{T2}%{F#BF616A}%{F-}%{T-} DESCONECTADO

; ==================================================
; DISCO
; ==================================================

[module/filesystem]

type = internal/fs

mount-0 = /
interval = 30

fixed-values = true

format-mounted = <label-mounted>

label-mounted = %{T2}%{F#A3BE8C}%{F-}%{T-} %used% / %free%

label-unmounted = DISCO NO DISPONIBLE
label-unmounted-foreground = ${colors.red}

; ==================================================
; VOLUMEN
; ==================================================

[module/pulseaudio]

type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

ramp-volume-font = 2
ramp-volume-foreground = ${colors.blue}

label-muted = %{T2}%{T-} SILENCIO
label-muted-foreground = ${colors.red}

click-right = pavucontrol

; ==================================================
; FECHA
; ==================================================

[module/calendar]

type = internal/date

interval = 60

date = %A, %d de %B de %Y

label = %date%
label-foreground = ${colors.foreground}

; ==================================================
; HORA
; ==================================================

[module/clock]

type = internal/date

interval = 1

time = %H:%M

label = %{T3}%time%%{T-}
label-foreground = ${colors.cyan}

; ==================================================
; AJUSTES GENERALES
; ==================================================

[settings]

screenchange-reload = true
pseudo-transparency = true
